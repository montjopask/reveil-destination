<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Réveil Destination</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg-dark: #1a1a2e;
    --bg-card: #16213e;
    --bg-input: #0f3460;
    --accent: #e94560;
    --accent-soft: #ff6b6b;
    --text: #eee;
    --text-muted: #a0a0b0;
    --success: #00d2a0;
    --warning: #f5a623;
    --radius: 12px;
    --shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg-card);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    z-index: 1000;
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .header h1 span { color: var(--accent); }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    color: var(--text-muted);
    transition: all 0.3s;
  }

  .status-badge.active {
    background: rgba(0, 210, 160, 0.15);
    color: var(--success);
  }

  .status-badge.alarm {
    background: rgba(233, 69, 96, 0.2);
    color: var(--accent);
    animation: pulse-badge 1s infinite;
  }

  @keyframes pulse-badge {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
  }

  .status-badge.active .status-dot { background: var(--success); }
  .status-badge.alarm .status-dot {
    background: var(--accent);
    animation: pulse-dot 1s infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.4); }
  }

  /* ===== MAP ===== */
  #map {
    flex: 1;
    z-index: 1;
  }

  /* ===== BOTTOM PANEL ===== */
  .panel {
    background: var(--bg-card);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding: 0;
    z-index: 1000;
    flex-shrink: 0;
    max-height: 55vh;
    overflow-y: auto;
    transition: max-height 0.3s;
  }

  .panel.collapsed { max-height: 60px; }

  .panel-handle {
    display: flex;
    justify-content: center;
    padding: 8px;
    cursor: pointer;
  }

  .panel-handle-bar {
    width: 40px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
  }

  .panel-content { padding: 0 16px 16px; }

  /* Search */
  .search-box {
    position: relative;
    margin-bottom: 12px;
  }

  .search-box input {
    width: 100%;
    padding: 12px 16px 12px 40px;
    background: var(--bg-input);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input:focus {
    border-color: var(--accent);
  }

  .search-box input::placeholder { color: var(--text-muted); }

  .search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 16px;
  }

  .search-results {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background: var(--bg-input);
    border-radius: 0 0 var(--radius) var(--radius);
    max-height: 200px;
    overflow-y: auto;
    z-index: 2000;
    display: none;
    border: 1px solid rgba(255,255,255,0.1);
    border-top: none;
  }

  .search-results.visible { display: block; }

  .search-result-item {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: background 0.15s;
  }

  .search-result-item:hover,
  .search-result-item:active {
    background: rgba(233, 69, 96, 0.1);
  }

  .search-result-item:last-child { border-bottom: none; }

  /* Radius */
  .radius-section {
    margin-bottom: 14px;
  }

  .radius-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .radius-value {
    color: var(--accent);
    font-weight: 600;
    font-size: 14px;
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    height: 6px;
    background: var(--bg-input);
    border-radius: 3px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(233,69,96,0.4);
  }

  /* Destination info */
  .destination-info {
    background: var(--bg-input);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 12px;
    display: none;
  }

  .destination-info.visible { display: block; }

  .destination-name {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
  }

  .destination-distance {
    font-size: 13px;
    color: var(--text-muted);
  }

  .destination-distance span {
    color: var(--warning);
    font-weight: 600;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }

  .btn-primary:active { background: #c73a52; }
  .btn-primary:disabled {
    background: rgba(233,69,96,0.3);
    color: rgba(255,255,255,0.4);
    cursor: not-allowed;
  }

  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: var(--text);
  }

  .btn-secondary:active { background: rgba(255,255,255,0.15); }

  .btn-stop {
    background: var(--success);
    color: var(--bg-dark);
  }

  .btn-stop:active { background: #00b88a; }

  .btn-fav {
    flex: 0;
    padding: 14px 16px;
    background: rgba(245, 166, 35, 0.15);
    color: var(--warning);
  }

  /* Favorites */
  .favorites-section {
    margin-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-top: 12px;
  }

  .favorites-title {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .fav-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .fav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-input);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .fav-item:active { background: rgba(233,69,96,0.1); }

  .fav-item-info {
    flex: 1;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .fav-item-delete {
    color: var(--text-muted);
    font-size: 18px;
    padding: 0 4px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .fav-item-delete:hover { color: var(--accent); }

  .no-favs {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    padding: 8px;
  }

  /* Alarm overlay */
  .alarm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(233, 69, 96, 0.95);
    z-index: 9999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    animation: alarm-flash 0.5s infinite alternate;
  }

  .alarm-overlay.visible {
    display: flex;
  }

  @keyframes alarm-flash {
    from { background: rgba(233, 69, 96, 0.92); }
    to { background: rgba(180, 40, 70, 0.95); }
  }

  .alarm-icon {
    font-size: 80px;
    animation: alarm-shake 0.3s infinite alternate;
  }

  @keyframes alarm-shake {
    from { transform: rotate(-15deg); }
    to { transform: rotate(15deg); }
  }

  .alarm-text {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    padding: 0 24px;
  }

  .alarm-subtext {
    font-size: 16px;
    opacity: 0.8;
  }

  .btn-alarm-stop {
    padding: 20px 60px;
    background: white;
    color: var(--accent);
    border: none;
    border-radius: 30px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  /* Leaflet overrides */
  .leaflet-control-zoom { display: none; }

  .leaflet-popup-content-wrapper {
    background: var(--bg-card);
    color: var(--text);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .leaflet-popup-tip { background: var(--bg-card); }

  .leaflet-popup-content { margin: 10px 14px; font-size: 14px; }

  /* Custom marker */
  .destination-marker {
    background: var(--accent);
    border: 3px solid white;
    border-radius: 50%;
    width: 20px; height: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .user-marker {
    background: #4285f4;
    border: 3px solid white;
    border-radius: 50%;
    width: 16px; height: 16px;
    box-shadow: 0 0 0 4px rgba(66,133,244,0.3);
  }

  /* Loading */
  .search-loading {
    text-align: center;
    padding: 12px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* Permission prompt */
  .permission-prompt {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 8000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .permission-prompt.hidden { display: none; }

  .permission-card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    max-width: 340px;
  }

  .permission-card h2 {
    font-size: 20px;
    margin-bottom: 12px;
  }

  .permission-card p {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .permission-card .btn {
    width: 100%;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1><span>&#9673;</span> Réveil Destination</h1>
  <div class="status-badge" id="statusBadge">
    <div class="status-dot"></div>
    <span id="statusText">En attente</span>
  </div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- BOTTOM PANEL -->
<div class="panel" id="panel">
  <div class="panel-handle" id="panelHandle">
    <div class="panel-handle-bar"></div>
  </div>
  <div class="panel-content">

    <!-- Search -->
    <div class="search-box">
      <div class="search-icon">&#128269;</div>
      <input type="text" id="searchInput" placeholder="Chercher une adresse, une gare..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>

    <!-- Destination Info -->
    <div class="destination-info" id="destInfo">
      <div class="destination-name" id="destName">—</div>
      <div class="destination-distance" id="destDistance">—</div>
    </div>

    <!-- Radius slider -->
    <div class="radius-section">
      <div class="radius-label">
        <span>Rayon d'alerte</span>
        <span class="radius-value" id="radiusValue">1 km</span>
      </div>
      <input type="range" id="radiusSlider" min="200" max="5000" step="100" value="1000">
    </div>

    <!-- Buttons -->
    <div class="btn-row" id="btnRow">
      <button class="btn btn-primary" id="btnStart" disabled>
        &#9654; Surveiller
      </button>
      <button class="btn btn-fav" id="btnFav" title="Ajouter aux favoris" style="display:none;">
        &#9734;
      </button>
    </div>

    <!-- Favorites -->
    <div class="favorites-section" id="favsSection">
      <div class="favorites-title">&#9733; Favoris</div>
      <div class="fav-list" id="favList">
        <div class="no-favs">Aucun favori enregistré</div>
      </div>
    </div>

  </div>
</div>

<!-- ALARM OVERLAY -->
<div class="alarm-overlay" id="alarmOverlay">
  <div class="alarm-icon">&#128276;</div>
  <div class="alarm-text" id="alarmText">Tu es arrivé !</div>
  <div class="alarm-subtext" id="alarmSubtext">—</div>
  <button class="btn-alarm-stop" id="btnAlarmStop">Arrêter l'alarme</button>
</div>

<!-- PERMISSION PROMPT -->
<div class="permission-prompt" id="permPrompt">
  <div class="permission-card">
    <h2>&#128205; Localisation requise</h2>
    <p>L'application a besoin d'accéder à ta position GPS pour te réveiller à destination.</p>
    <button class="btn btn-primary" id="btnPermission">Autoriser la localisation</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
  'use strict';

  // ===== STATE =====
  const state = {
    map: null,
    userPos: null,
    destPos: null,
    destName: '',
    radius: 1000,
    watching: false,
    watchId: null,
    wakeLock: null,
    alarmActive: false,
    audioCtx: null,
    oscillator: null,
    gainNode: null,
    userMarker: null,
    destMarker: null,
    radiusCircle: null,
    searchTimeout: null,
  };

  // ===== STORAGE =====
  function loadFavorites() {
    try {
      return JSON.parse(localStorage.getItem('rd_favorites') || '[]');
    } catch { return []; }
  }

  function saveFavorites(favs) {
    localStorage.setItem('rd_favorites', JSON.stringify(favs));
  }

  // ===== MAP INIT =====
  function initMap() {
    state.map = L.map('map', {
      center: [43.7, 6.5],
      zoom: 10,
      zoomControl: false,
      attributionControl: false,
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(state.map);

    // Tap on map to set destination
    state.map.on('click', function(e) {
      if (state.watching) return;
      setDestination(e.latlng.lat, e.latlng.lng, `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`);
    });
  }

  // ===== USER LOCATION =====
  function requestLocation() {
    if (!navigator.geolocation) {
      alert('La géolocalisation n\'est pas supportée par ton navigateur.');
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        document.getElementById('permPrompt').classList.add('hidden');
        updateUserPos(pos.coords.latitude, pos.coords.longitude);
        state.map.setView([pos.coords.latitude, pos.coords.longitude], 13);
      },
      (err) => {
        console.warn('Geolocation error:', err);
        document.getElementById('permPrompt').classList.add('hidden');
        // Still allow app usage — user can set destination on map
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  function updateUserPos(lat, lng) {
    state.userPos = { lat, lng };

    if (state.userMarker) {
      state.userMarker.setLatLng([lat, lng]);
    } else {
      const icon = L.divIcon({
        className: 'user-marker',
        iconSize: [16, 16],
        iconAnchor: [8, 8],
      });
      state.userMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 }).addTo(state.map);
    }

    // Update distance
    if (state.destPos) {
      updateDistanceDisplay();
      checkProximity();
    }
  }

  // ===== DESTINATION =====
  function setDestination(lat, lng, name) {
    state.destPos = { lat, lng };
    state.destName = name || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;

    // Update marker
    if (state.destMarker) {
      state.destMarker.setLatLng([lat, lng]);
    } else {
      const icon = L.divIcon({
        className: 'destination-marker',
        iconSize: [20, 20],
        iconAnchor: [10, 10],
      });
      state.destMarker = L.marker([lat, lng], { icon }).addTo(state.map);
    }

    // Update radius circle
    updateRadiusCircle();

    // Show info
    document.getElementById('destInfo').classList.add('visible');
    document.getElementById('destName').textContent = state.destName;
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnFav').style.display = '';

    // Zoom to fit
    if (state.userPos) {
      const bounds = L.latLngBounds(
        [state.userPos.lat, state.userPos.lng],
        [lat, lng]
      );
      state.map.fitBounds(bounds.pad(0.3));
      updateDistanceDisplay();
    } else {
      state.map.setView([lat, lng], 14);
    }

    // Clear search
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').classList.remove('visible');
  }

  function updateRadiusCircle() {
    if (!state.destPos) return;

    if (state.radiusCircle) {
      state.radiusCircle.setLatLng([state.destPos.lat, state.destPos.lng]);
      state.radiusCircle.setRadius(state.radius);
    } else {
      state.radiusCircle = L.circle([state.destPos.lat, state.destPos.lng], {
        radius: state.radius,
        color: '#e94560',
        fillColor: '#e94560',
        fillOpacity: 0.12,
        weight: 2,
        dashArray: '6 4',
      }).addTo(state.map);
    }
  }

  function updateDistanceDisplay() {
    if (!state.userPos || !state.destPos) return;
    const d = haversine(state.userPos.lat, state.userPos.lng, state.destPos.lat, state.destPos.lng);
    let text;
    if (d < 1000) {
      text = `${Math.round(d)} m`;
    } else {
      text = `${(d / 1000).toFixed(1)} km`;
    }
    document.getElementById('destDistance').innerHTML = `Distance : <span>${text}</span>`;
  }

  // ===== HAVERSINE =====
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // ===== SEARCH (Nominatim) =====
  function searchAddress(query) {
    if (query.length < 3) {
      document.getElementById('searchResults').classList.remove('visible');
      return;
    }

    const results = document.getElementById('searchResults');
    results.innerHTML = '<div class="search-loading">Recherche...</div>';
    results.classList.add('visible');

    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=6&accept-language=fr`;

    fetch(url, {
      headers: { 'User-Agent': 'ReveilDestination/1.0' }
    })
    .then(r => r.json())
    .then(data => {
      if (!data.length) {
        results.innerHTML = '<div class="search-loading">Aucun résultat</div>';
        return;
      }
      results.innerHTML = '';
      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'search-result-item';
        div.textContent = item.display_name;
        div.addEventListener('click', () => {
          setDestination(parseFloat(item.lat), parseFloat(item.lon), item.display_name.split(',').slice(0, 2).join(','));
        });
        results.appendChild(div);
      });
    })
    .catch(() => {
      results.innerHTML = '<div class="search-loading">Erreur de recherche</div>';
    });
  }

  // ===== WATCHING =====
  function startWatching() {
    if (!state.destPos) return;

    state.watching = true;

    // Update UI
    document.getElementById('btnRow').innerHTML = `
      <button class="btn btn-stop" id="btnStopWatch" onclick="window._stop()">&#9632; Arrêter</button>
    `;
    document.getElementById('statusBadge').className = 'status-badge active';
    document.getElementById('statusText').textContent = 'Surveillance active';

    // Collapse panel
    document.getElementById('panel').classList.add('collapsed');

    // Request wake lock
    requestWakeLock();

    // Start GPS watch
    state.watchId = navigator.geolocation.watchPosition(
      (pos) => {
        updateUserPos(pos.coords.latitude, pos.coords.longitude);
      },
      (err) => {
        console.warn('Watch error:', err);
      },
      {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 30000,
      }
    );
  }

  function stopWatching() {
    state.watching = false;

    if (state.watchId !== null) {
      navigator.geolocation.clearWatch(state.watchId);
      state.watchId = null;
    }

    releaseWakeLock();
    stopAlarm();

    // Restore UI
    document.getElementById('btnRow').innerHTML = `
      <button class="btn btn-primary" id="btnStart" onclick="window._start()">&#9654; Surveiller</button>
      <button class="btn btn-fav" id="btnFav" onclick="window._addFav()" title="Ajouter aux favoris">&#9734;</button>
    `;
    if (!state.destPos) document.getElementById('btnStart').disabled = true;
    document.getElementById('statusBadge').className = 'status-badge';
    document.getElementById('statusText').textContent = 'En attente';
    document.getElementById('panel').classList.remove('collapsed');
  }

  window._stop = stopWatching;
  window._start = startWatching;

  // ===== PROXIMITY CHECK =====
  function checkProximity() {
    if (!state.watching || !state.userPos || !state.destPos) return;

    const dist = haversine(state.userPos.lat, state.userPos.lng, state.destPos.lat, state.destPos.lng);

    if (dist <= state.radius && !state.alarmActive) {
      triggerAlarm();
    }
  }

  // ===== ALARM =====
  function triggerAlarm() {
    state.alarmActive = true;

    // Visual
    document.getElementById('alarmOverlay').classList.add('visible');
    document.getElementById('alarmText').textContent = 'Tu es arrivé !';
    document.getElementById('alarmSubtext').textContent = state.destName;
    document.getElementById('statusBadge').className = 'status-badge alarm';
    document.getElementById('statusText').textContent = 'ARRIVÉE';

    // Sound — aggressive alarm to actually wake someone up
    playAlarmSound();

    // Vibration
    if (navigator.vibrate) {
      vibrateLoop();
    }
  }

  function playAlarmSound() {
    try {
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Create an aggressive, attention-grabbing alarm
      function playTone(freq, start, duration) {
        const osc = state.audioCtx.createOscillator();
        const gain = state.audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.3, state.audioCtx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.01, state.audioCtx.currentTime + start + duration);
        osc.connect(gain);
        gain.connect(state.audioCtx.destination);
        osc.start(state.audioCtx.currentTime + start);
        osc.stop(state.audioCtx.currentTime + start + duration);
      }

      function alarmCycle() {
        if (!state.alarmActive) return;
        // Two-tone alarm pattern
        for (let i = 0; i < 8; i++) {
          playTone(880, i * 0.25, 0.12);
          playTone(660, i * 0.25 + 0.12, 0.12);
        }
        setTimeout(alarmCycle, 2500);
      }

      alarmCycle();
    } catch (e) {
      console.warn('Audio error:', e);
    }
  }

  function vibrateLoop() {
    if (!state.alarmActive) return;
    navigator.vibrate([300, 100, 300, 100, 500]);
    setTimeout(vibrateLoop, 1500);
  }

  function stopAlarm() {
    state.alarmActive = false;
    document.getElementById('alarmOverlay').classList.remove('visible');

    if (state.audioCtx) {
      state.audioCtx.close().catch(() => {});
      state.audioCtx = null;
    }

    if (navigator.vibrate) {
      navigator.vibrate(0);
    }
  }

  // ===== WAKE LOCK =====
  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        state.wakeLock = await navigator.wakeLock.request('screen');
        state.wakeLock.addEventListener('release', () => {
          // Re-acquire if still watching
          if (state.watching) {
            setTimeout(requestWakeLock, 1000);
          }
        });
      } catch (e) {
        console.warn('Wake Lock error:', e);
      }
    }
  }

  function releaseWakeLock() {
    if (state.wakeLock) {
      state.wakeLock.release().catch(() => {});
      state.wakeLock = null;
    }
  }

  // Re-acquire wake lock on visibility change
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.watching) {
      requestWakeLock();
    }
  });

  // ===== FAVORITES =====
  function renderFavorites() {
    const favs = loadFavorites();
    const list = document.getElementById('favList');

    if (!favs.length) {
      list.innerHTML = '<div class="no-favs">Aucun favori enregistré</div>';
      return;
    }

    list.innerHTML = '';
    favs.forEach((fav, idx) => {
      const item = document.createElement('div');
      item.className = 'fav-item';
      item.innerHTML = `
        <div class="fav-item-info">${fav.name}</div>
        <div class="fav-item-delete" data-idx="${idx}">&times;</div>
      `;
      item.querySelector('.fav-item-info').addEventListener('click', () => {
        setDestination(fav.lat, fav.lng, fav.name);
      });
      item.querySelector('.fav-item-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        const f = loadFavorites();
        f.splice(idx, 1);
        saveFavorites(f);
        renderFavorites();
      });
      list.appendChild(item);
    });
  }

  function addFavorite() {
    if (!state.destPos) return;
    const favs = loadFavorites();

    // Check if already saved
    const exists = favs.some(f =>
      Math.abs(f.lat - state.destPos.lat) < 0.0005 &&
      Math.abs(f.lng - state.destPos.lng) < 0.0005
    );

    if (exists) return;

    favs.push({
      name: state.destName,
      lat: state.destPos.lat,
      lng: state.destPos.lng,
    });

    saveFavorites(favs);
    renderFavorites();
  }

  window._addFav = addFavorite;

  // ===== EVENT BINDINGS =====
  function init() {
    initMap();

    // Permission button
    document.getElementById('btnPermission').addEventListener('click', requestLocation);

    // Check if we already have permission
    if (navigator.permissions) {
      navigator.permissions.query({ name: 'geolocation' }).then(result => {
        if (result.state === 'granted') {
          document.getElementById('permPrompt').classList.add('hidden');
          requestLocation();
        }
      }).catch(() => {});
    }

    // Search input
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', () => {
      clearTimeout(state.searchTimeout);
      state.searchTimeout = setTimeout(() => {
        searchAddress(searchInput.value.trim());
      }, 400);
    });

    // Close search on blur (delayed)
    searchInput.addEventListener('blur', () => {
      setTimeout(() => {
        document.getElementById('searchResults').classList.remove('visible');
      }, 300);
    });

    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim().length >= 3) {
        searchAddress(searchInput.value.trim());
      }
    });

    // Radius slider
    const slider = document.getElementById('radiusSlider');
    slider.addEventListener('input', () => {
      state.radius = parseInt(slider.value);
      const label = state.radius >= 1000
        ? `${(state.radius / 1000).toFixed(1)} km`
        : `${state.radius} m`;
      document.getElementById('radiusValue').textContent = label;
      updateRadiusCircle();
    });

    // Start button
    document.getElementById('btnStart').addEventListener('click', startWatching);
    document.getElementById('btnFav').addEventListener('click', addFavorite);

    // Alarm stop
    document.getElementById('btnAlarmStop').addEventListener('click', () => {
      stopAlarm();
      stopWatching();
    });

    // Panel toggle
    document.getElementById('panelHandle').addEventListener('click', () => {
      document.getElementById('panel').classList.toggle('collapsed');
      setTimeout(() => state.map.invalidateSize(), 350);
    });

    // Render favorites
    renderFavorites();
  }

  // Service Worker registration
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // Start
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
